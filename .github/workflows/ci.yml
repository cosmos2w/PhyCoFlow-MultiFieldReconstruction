name: contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,operator,keops,topology,multitask,posttrain_constraints,posttrain,plot]"
      - name: Verify TorchJD and Cooper are installed
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import cooper
          import torchjd

          assert version("torchjd") == "0.17.1"
          assert version("cooper-optim") == "1.0.1"
          print(f"TorchJD {version('torchjd')} and Cooper {version('cooper-optim')} are available")
          PY
      - name: Lint permanent source
        run: ruff check src tests scripts cases benchmarks
      - name: Run CPU contract and unit tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: pytest
      - name: Validate canonical case configuration composition
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path

          from phycoflow_reconstruction.config import load_config, validate_config

          paths = sorted(Path("cases").glob("*/configs/base/*.yaml"))
          paths = [path for path in paths if path.name != "latent_fm_stage2.yaml"]
          for path in paths:
              validate_config(load_config(path))
          print(f"validated {len(paths)} canonical base configurations")
          PY
      - name: Check repository architecture
        run: |
          test ! -d src/phycoflow_pointcloud
          ! git ls-files -z -- '*.py' | xargs -0 grep -nH 'phycoflow_pointcloud'
