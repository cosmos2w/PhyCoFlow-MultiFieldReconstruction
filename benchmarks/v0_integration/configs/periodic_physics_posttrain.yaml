  epochs: 1
  batch_size: 1
  lr: 5.0e-05
  weight_decay: 0.0
  grad_clip: 1.0
  gradient_balance: weighted_sum
runtime:
  seed: 42
  device: cuda:0
  deterministic: true
  num_workers: 0
output:
  experiment_name: phase8_brusselator_physics_posttrain
