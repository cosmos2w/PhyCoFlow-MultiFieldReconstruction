dataset:
  path: /data/wanglz/PhyCoFlow/datagen/processed/brusselator.h5
  split: train
  reconstruction_unit: snapshot
  field_names:
  - u
  - v
  field_units:
  - dimensionless
  - dimensionless
  normalization: mean_std
  time_stride: 1
  benchmark_eligible: true
  include_temporal_derivative: true
observations:
  protocol: random_uniform
  seed: 42
  fields:
    u:
      count: 128
stage: post_training
case: brusselator
source_run: /home/wanglz/Desktop/src/PhyCoFlow/Proj_MultiFieldReconstruction/Cases/brusselator/runs/phase4_final_coordinate_mlp/20260814T224525Z_2110739a
source_checkpoint: last.pt
inherit_base_config: true
source:
  kind: native_run
  allow_integration_source: true
  inherited_base_keys:
  - dataset
  - model
  - observations
  config_origins:
    dataset: source_run.resolved_config.yaml
    model: source_run.resolved_config.yaml
    observations: source_run.resolved_config.yaml
    post_training: child_config
model:
  name: coordinate_mlp
  hidden_dim: 128
  fourier_bands: 16
  query_points: 4096
