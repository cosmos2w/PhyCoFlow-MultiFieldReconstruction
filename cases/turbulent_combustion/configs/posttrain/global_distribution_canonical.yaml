# Post-training profile: source model, objectives, rollout, and execution settings.

# Composition order; later files override earlier defaults.
defaults:
  - ../dataset.yaml
  - ../sensors/T_only_random.yaml
  - ../coherence/global_distribution_canonical.yaml

# Run identity. Choices: base_training | post_training | direct_physics.
stage: post_training  # choices: base_training | post_training | direct_physics
case: turbulent_combustion

# Source checkpoint selection for post-training.
source_run: null
source_checkpoint: last.pt
inherit_base_config: true

# Source adapter. kind choices: native_run | legacy_demo50.
source: {kind: native_run, allow_integration_source: true}

# Model family and architecture settings.
model: {name: pointcloud_ffm, backbone: gl_rbf_enh, gather_mode: topk_rbf}

# Sensor sampling. protocol choices: random_uniform | structured_stride | uniform_spacetime_stride.
observations: {protocol: random_uniform, seed: 42, fields: {T: {count: 128}}}

# Enabled loss terms and their relative weights.
objectives:
  data_retention: {enabled: true, weight: 0.1}
  coherence: {enabled: true, weight: 1.0}

# Differentiable rollout. solver choices: euler | heun.
rollout: {steps: 2, solver: euler}

# Observation enforcement. mode choices: none | hard | endpoint | endpoint_smooth.
observation_consistency: {mode: endpoint_smooth, strength: 1.0, sigma: 0.05, schedule_power: 2.0, final_clamp: true, chunk_size: 4096}

# Trainable scope. Choices: full_model | named_modules.
trainable: {scope: full_model}

# Training duration, batch sizing, optimizer, and gradient controls.
optimization: {epochs: 1, batch_size: 1, train_fraction: 0.01, lr: 5.0e-5, weight_decay: 0.0, grad_clip: 1.0, gradient_balance: weighted_sum, config_missing_behavior: error}

# Reproducibility and execution. data_strategy choices: auto | vram | async_cpu.
runtime: {seed: 42, device: 'cuda:0', deterministic: true, num_workers: 0}

# Validation and preview policy. split choices: train | validation | test.
evaluation:
  split: validation  # choices: train | validation | test
  max_samples: 1
  query_points: 512
  generation_steps: 2
  seed: 2027
  preview: {enabled: true, loss_every_epochs: 10, reconstruct_every_epochs: 500, split: validation, sample_index: 0, query_points: null, generation_steps: 2, seed: 2027, keep_history: false}

# Checkpoint enablement and save cadence.
checkpointing: {enabled: true, every_epochs: 10, save_epoch_one: false}

# Stable experiment identifier used for the run directory.
output: {experiment_name: phase7_combustion_global_distribution}
