# Coherence template: compute budget, target source, and enabled components.

# Coherence schedule, compute budget, and statistical families.
coherence:

  # Activation, cadence, and warmup.
  schedule: {start_epoch: 1, every_n_steps: 1, weight_warmup_epochs: 0, interval_rescale: false}

  # Coherence minibatch and query set. query_policy choices: random_per_sample | fixed_shared.
  compute_budget: {batch_size: 1, point_count: 512}

  # Enabled families: global_distribution | cross_spectrum | topology.
  families:

    # Marginal, mutual, and cross-field distribution constraints.
    global_distribution:
      enabled: true
      target_use: training_reference  # choices: training_reference | paired_supervised
      units: model_units  # choices: model_units | physical_units
      fields: [CH4, CO, T, U_1, p]

      # Reference target cache; required for training_reference targets.
      reference_bank: {enabled: true, path: null, max_samples: 8, points_per_sample: 512, seed: 1234}

      # Component enablement and relative weights.
      components:
        self: {enabled: true, weight: 1.0}
        mutual: {enabled: true, weight: 1.0, directions: 8, seed: 1234}
        cross: {enabled: true, weight: 1.0, directions: 16, top_fraction: 0.1, seed: 1234, include_axes: true, qmc: true}
