defaults:
  - global_distribution_demo50.yaml

coherence:
  compute_budget:
    batch_size: 4
    point_count: 4096
    query_policy: fixed_shared
    query_seed: 100045
  families:
    global_distribution:
      weight: 1.0
    cross_spectrum:
      enabled: true
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      fields: [CO, T, U_0, U_1, p]
      pairs: [[CO, T], [T, U_0], [T, U_1], [U_0, U_1]]
      reference_bank: {enabled: false}
      graph:
        k_neighbors: 16
        sigma: null
        num_modes: 48
        exclude_zero: true
        bands: [low, mid, high]
      eps: 1.0e-8
      components:
        same_frequency: {enabled: true, weight: 1.0}
        cross_frequency: {enabled: true, weight: 1.0}
        band_energy: {enabled: false, weight: 0.0}
    topology:
      enabled: true
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      fields: [CO, T]
      reference_bank: {enabled: false}
      geometry:
        grid_shape: [32, 128]
        axes: [0, 1]
        neighbors: 4
        power: 2.0
        periodic: false
      filtration:
        quantiles: [0.10, 0.25, 0.40, 0.50, 0.60, 0.75, 0.90]
        dimensions: [0, 1]
        directions: [superlevel, sublevel]
        sharpness: 12.0
        smoothing_sigma: 0.8
      components:
        self: {enabled: true, weight: 1.0}
        mutual:
          enabled: true
          weight: 1.0
          pairs: [[CO, T]]
          lines: 3
          theta_min_degrees: 15.0
