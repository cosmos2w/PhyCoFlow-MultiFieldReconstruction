# Coherence template: compute budget, target source, and enabled components.

# Composition order; later files override earlier defaults.
defaults:
  - global_distribution_demo50.yaml

# Coherence schedule, compute budget, and statistical families.
coherence:

  # Coherence minibatch and query set. query_policy choices: random_per_sample | fixed_shared.
  compute_budget:
    batch_size: 4
    point_count: 4096
    query_policy: fixed_shared  # choices: random_per_sample | fixed_shared
    query_seed: 100045

  # Enabled families: global_distribution | cross_spectrum | topology.
  families:

    # Marginal, mutual, and cross-field distribution constraints.
    global_distribution:
      weight: 1.0

    # Graph-spectrum alignment for configured field pairs.
    cross_spectrum:
      enabled: true
      weight: 1.0
      target_use: paired_supervised  # choices: training_reference | paired_supervised
      units: model_units  # choices: model_units | physical_units
      fields: [CO, T, U_0, U_1, p]
      pairs: [[CO, T], [T, U_0], [T, U_1], [U_0, U_1]]

      # Reference target cache; required for training_reference targets.
      reference_bank: {enabled: false}

      # Graph construction and retained spectral bands.
      graph:
        k_neighbors: 16
        sigma: null
        num_modes: 48
        exclude_zero: true
        bands: [low, mid, high]
      eps: 1.0e-8

      # Component enablement and relative weights.
      components:
        # Explicit per-field, modewise auto-spectrum matching; independently disable-able.
        self_spectrum: {enabled: true, weight: 1.0}
        same_frequency: {enabled: true, weight: 1.0}
        cross_frequency: {enabled: true, weight: 1.0}
        band_energy: {enabled: false, weight: 0.0}

    # Spatially-aware cubical persistence alignment.
    topology:
      enabled: true
      weight: 1.0
      target_use: paired_supervised  # choices: training_reference | paired_supervised
      units: model_units  # choices: model_units | physical_units
      fields: [CO, T]

      # Reference target cache; required for training_reference targets.
      reference_bank: {enabled: false}

      # Topology grid and neighborhood geometry. Periodic rasters are not supported:
      # creator separations are measured in the plain box.
      geometry:
        grid_shape: [32, 128]
        axes: [0, 1]
        neighbors: 4
        power: 2.0
        periodic: false

      # Lower-star filtration. direction choices: superlevel | sublevel.
      filtration:
        dimensions: [0, 1]
        directions: [sublevel, superlevel]
        smoothing_sigma: 0.8

      # Partial matching. spatial_mode choices: multiplicative | additive.
      # lambda_spatial: 0 recovers plain Wasserstein matching exactly.
      # min_persistence drops noise bars at the reduction, as a fraction of the
      # reference field's value range.
      matching:
        order: 1.0
        lambda_spatial: 1.0
        spatial_mode: multiplicative
        min_persistence: 0.01

      # Component enablement and relative weights.
      components:
        self: {enabled: true, weight: 1.0}
        mutual:
          enabled: true
          weight: 1.0
          pairs: [[CO, T]]
          lines: 8
          line_sampling: stratified  # choices: stratified | uniform
          angle_margin: 0.12
          seed: 0
