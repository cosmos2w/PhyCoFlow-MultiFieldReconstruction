# DiffusionPDE baseline matched to the tc_gl_rbf_cq_cached_kv_5000ep run.

defaults:
  - ../../../../configs/defaults/base_training.yaml
  - ../dataset.yaml
  - ../sensors/T_only_random_192_384.yaml
  - ../../../../configs/models/diffusion_pde.yaml

stage: base_training
case: turbulent_combustion

dataset:
  normalization: mean_std
  normalization_stats_path: configs/normalization/train_mean_std.json

optimization:
  epochs: 5000
  # The multiscale U-Net operates on every 100 x 403 target point. Increase
  # only after checking peak memory on the selected GPU.
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  backward_loss_scale: 1.0

runtime:
  seed: 42
  device: cuda:2
  deterministic: true
  num_workers: 4
  data_strategy: async_cpu
  progress: true
  plot_every_steps: 50

# DiffusionPDE requires complete 100 x 403 targets, so query subsampling is disabled.
evaluation:
  split: validation
  max_samples: 20
  query_points: null
  generation_steps: 4
  seed: 2027
  preview:
    enabled: true
    loss_every_epochs: 10
    reconstruct_every_epochs: 500
    split: validation
    sample_index: 0
    query_points: null
    generation_steps: 4
    seed: 2027
    keep_history: true

checkpointing:
  enabled: true
  every_epochs: 10
  epochs: [100, 500, 1000, 2000, 5000]
  save_epoch_one: false

benchmark_telemetry:
  enabled: true
  sample_steps: 5

output:
  experiment_name: tc_diffusion_pde_5000ep
