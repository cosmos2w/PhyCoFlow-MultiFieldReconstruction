# Runnable case profile composed from shared defaults, data, sensors, and model settings.

# Composition order; later files override earlier defaults.
defaults:
  - ../../../../configs/defaults/base_training.yaml
  - ../dataset.yaml
  - ../sensors/T_only_random_192_384.yaml
  - ../../../../configs/models/gl_rbf_cq.yaml

# Run identity. Choices: base_training | post_training | direct_physics.
stage: base_training  # choices: base_training | post_training | direct_physics
case: turbulent_combustion

# Dataset source, representation, field schema, and normalization.
dataset:
  normalization: mean_std  # choices: none | mean_std | robust_99
  normalization_stats_path: configs/normalization/train_mean_std.json

# Training duration, batch sizing, optimizer, and gradient controls.
optimization:
  epochs: 5000
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  backward_loss_scale: 1.0

# Reproducibility and execution. data_strategy choices: auto | vram | async_cpu.
runtime:
  seed: 42
  device: cuda:0  # choices: cpu | cuda[:index]
  deterministic: true
  num_workers: 4
  data_strategy: async_cpu  # choices: auto | vram | async_cpu
  progress: true
  plot_every_steps: 50  # redraw loss_history.png every 50 epochs

# Validation and preview policy. split choices: train | validation | test.
evaluation:
  split: validation  # choices: train | validation | test
  max_samples: 20
  query_points: 4096
  generation_steps: 4
  seed: 2027
  preview:  # Validation loss and qualitative reconstruction have independent cadences.
    enabled: true  # mandatory overfitting monitor
    loss_every_epochs: 10  # cheap fixed validation loss; updates loss_history.png
    reconstruct_every_epochs: 500  # expensive on-the-fly reconstruction artifacts
    split: validation  # choices: train | validation | test
    sample_index: 0
    query_points: 4096
    generation_steps: 4
    seed: 2027
    keep_history: true

# Checkpoint enablement and save cadence.
checkpointing:
  enabled: true
  every_epochs: 10  # refresh last.pt; every validation result can independently update best.pt
  epochs: [100, 500, 1000, 2000, 5000]
  save_epoch_one: false

# Optional benchmark timing and memory sampling.
benchmark_telemetry:
  enabled: true
  sample_steps: 5

# Stable experiment identifier used for the run directory.
output:
  experiment_name: tc_gl_rbf_cq_cached_kv_5000ep
