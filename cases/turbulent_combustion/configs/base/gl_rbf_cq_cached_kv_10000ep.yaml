defaults:
  - ../../../../configs/defaults/base_training.yaml
  - ../dataset.yaml
  - ../sensors/T_only_random_192_384.yaml
  - ../../../../configs/models/gl_rbf_cq.yaml

stage: base_training
case: turbulent_combustion
dataset:
  normalization: mean_std
  normalization_stats_path: configs/normalization/train_mean_std.json
optimization:
  epochs: 10000
  batch_size: 40
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  backward_loss_scale: 1.0
runtime:
  seed: 42
  device: cuda:0
  deterministic: true
  num_workers: 4
  data_strategy: async_cpu
  progress: true
  plot_every_steps: 200
evaluation:
  split: validation
  max_samples: 20
  query_points: 4096
  generation_steps: 32
  seed: 2027
  preview:
    enabled: false
    every_epochs: 20
    split: validation
    sample_index: 0
    query_points: 4096
    generation_steps: 32
    seed: 2027
    keep_history: false
checkpointing:
  enabled: true
  every_epochs: 500
  epochs: [1, 20, 40, 60, 100, 150, 200, 500, 1000, 2000, 5000, 10000]
  save_epoch_one: true
benchmark_telemetry:
  enabled: true
  sample_steps: 5
output:
  experiment_name: tc_gl_rbf_cq_cached_kv_10000ep
