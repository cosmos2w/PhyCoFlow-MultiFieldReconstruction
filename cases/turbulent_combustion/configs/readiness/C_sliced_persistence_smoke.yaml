# One-epoch, topology-only smoke profile for cubical persistence.
defaults: [_common.yaml]

source_checkpoint: last.pt
model: {model_ema_eval: false}

optimization:
  epochs: 1
  batch_size: 1
  train_fraction: 0.001

runtime:
  device: cuda:1

evaluation:
  max_samples: 1

coherence:
  compute_budget: {batch_size: 1, point_count: 4096, query_policy: fixed_shared, query_seed: 100045}
  family_balance: {mode: initial_grad_norm, calibration_batches: 2, reference: median, epsilon: 1.0e-12, scale_min: 0.00001, scale_max: 100.0, max_batch_ratio: 100.0, gradient_diagnostics_every_epochs: 1, seed: 700043}
  families:
    topology:
      enabled: true
      strategy: cubical_persistence
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      fields: [CO, T]
      reference_bank: {enabled: false}
      geometry:
        grid_shape: [32, 128]
        axes: [0, 1]
        neighbors: 4
        power: 2.0
        periodic: false
        allow_projected_collisions: false
        antialias_downsample: true
      filtration:
        dimensions: [0, 1]
        directions: [sublevel, superlevel]
        smoothing_sigma: 0.0
      persistence:
        projections: 32
        essential_weight: 0.1
        scale_floor: 0.0001
        distance: sliced_wasserstein
      components:
        self: {enabled: true, weight: 1.0, fields: [CO, T]}
        mutual:
          enabled: true
          weight: 1.0
          groups: [[CO, T]]
          lines: 3
          seed: 1729
          direction_floor: 0.25
          offset_range: 1.0

output: {experiment_name: coherence_fix_C_sliced_persistence_smoke}
