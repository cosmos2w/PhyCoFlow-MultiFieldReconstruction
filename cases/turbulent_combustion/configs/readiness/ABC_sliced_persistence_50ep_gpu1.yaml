# Short all-family test built from the existing A+B readiness objective.
defaults: [_common.yaml]

source_checkpoint: last.pt
model: {model_ema_eval: false}

optimization:
  epochs: 50
  batch_size: 8
  train_fraction: 0.01

runtime:
  device: cuda:1
  plot_every_steps: 25

evaluation:
  max_samples: 8
  preview:
    enabled: true
    loss_every_epochs: 5
    reconstruct_every_epochs: 50

checkpointing:
  selection_metric: topology_with_fidelity
  validation_every_epochs: 5

posttrain_fidelity:
  max_relative_mse_increase: 0.05
  max_relative_field_mse_increase: 0.05
  behavior: report

coherence:
  compute_budget: {batch_size: 8, point_count: 4096, query_policy: fixed_shared, query_seed: 100045}
  family_balance: {mode: initial_grad_norm, calibration_batches: 2, reference: median, epsilon: 1.0e-12, scale_min: 0.00001, scale_max: 100.0, max_batch_ratio: 100.0, gradient_diagnostics_every_epochs: 1, seed: 700043}
  families:
    global_distribution:
      enabled: true
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      fields: [CH4, CO, T, U_1, p]
      reference_bank: {enabled: false}
      components:
        self: {enabled: true, weight: 1.0}
        mutual: {enabled: true, weight: 1.0, directions: 8, seed: 1234}
        cross: {enabled: true, weight: 1.0, directions: 16, top_fraction: 0.1, seed: 1234, include_axes: true, qmc: true}
    cross_spectrum:
      enabled: true
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      fields: [CH4, CO, T, U_1, p]
      pairs: [[CO, T], [T, CH4], [T, U_1], [CH4, U_1]]
      reference_bank: {enabled: false}
      graph: {k_neighbors: 16, sigma: null, num_modes: 48, exclude_zero: true, bands: [low, mid, high]}
      eps: 1.0e-8
      components:
        self_spectrum: {enabled: false, weight: 1.0}
        same_frequency: {enabled: true, weight: 1.0}
        cross_frequency: {enabled: true, weight: 1.0}
        band_energy: {enabled: false, weight: 0.0}
    topology:
      enabled: true
      strategy: cubical_persistence
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      fields: [CO, T]
      reference_bank: {enabled: false}
      geometry:
        grid_shape: [32, 128]
        axes: [0, 1]
        neighbors: 4
        power: 2.0
        periodic: false
        allow_projected_collisions: false
        antialias_downsample: true
      filtration:
        dimensions: [0, 1]
        directions: [sublevel, superlevel]
        smoothing_sigma: 0.0
      persistence:
        projections: 32
        essential_weight: 0.1
        scale_floor: 0.0001
        distance: sliced_wasserstein
      components:
        self: {enabled: true, weight: 1.0, fields: [CO, T]}
        mutual:
          enabled: true
          weight: 1.0
          groups: [[CO, T]]
          lines: 3
          seed: 1729
          direction_floor: 0.25
          offset_range: 1.0

output: {experiment_name: coherence_fix_ABC_sliced_persistence_50ep_gpu1}
