# Shu et al. Kolmogorov vorticity in the canonical schema (build_dataset.py).
dataset:
  path: ../../datasets/kolmogorov_shu/kolmogorov_shu.h5
  split: train
  reconstruction_unit: snapshot
  field_names: [vorticity]
  field_units: [dimensionless]
  normalization: mean_std
  time_stride: 1
  benchmark_eligible: true
  grid_mapping_verified: true
  coordinate_dim: 2
  grid_shape: [256, 256]
