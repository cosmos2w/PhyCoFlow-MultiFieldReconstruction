# The w296 GL_rbf_CQ run (gl_rbf_cq_w296.yaml) trained on 65-6,554 sensors per frame
# instead of 655. A full copy of the postdoc file because deep_merge cannot drop the
# fixed `count` of the 1 % sensor profile.

defaults:
  - ../../../../configs/defaults/base_training.yaml
  - ../dataset.yaml
  - ../sensors/vorticity_random_range.yaml
  - ../../../../configs/models/gl_rbf_cq.yaml

stage: base_training
case: kolmogorov_shu

model:
  hidden_dim: 296
  cond_dim: 296
  field_embed_dim: 148
  latent_dim: 296
  num_latents: 64
  num_latent_blocks: 3
  num_heads: 4

# Constant learning rate (no scheduler upstream), so the epoch cap does not
# change the trajectory up to any earlier epoch.
optimization:
  epochs: 4000
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
  backward_loss_scale: 1.0

runtime:
  seed: 42
  device: cuda:0
  deterministic: true
  num_workers: 4
  data_strategy: auto
  progress: false
  plot_every_steps: 50

evaluation:
  split: validation
  max_samples: 20
  query_points: 4096
  generation_steps: 4
  seed: 2027
  preview:
    enabled: true
    loss_every_epochs: 10
    reconstruct_every_epochs: 500
    split: validation
    sample_index: 0
    query_points: 4096
    generation_steps: 4
    seed: 2027
    keep_history: true

checkpointing:
  enabled: true
  every_epochs: 10
  epochs: [500, 1000, 1500, 2000, 3000, 4000, 5000, 7500, 10000]
  save_epoch_one: false

benchmark_telemetry:
  enabled: true
  sample_steps: 5

output:
  experiment_name: kolm_shu_gl_rbf_cq_w296_range
