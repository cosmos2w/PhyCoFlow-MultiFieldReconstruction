# Case dataset contract: source, representation, fields, scaling, and geometry.

# Dataset source, representation, field schema, and normalization.
dataset:

  # Data source and split selection.
  path: ../../datasets/ks/ks.h5
  split: train  # choices: train | validation | test

  # Sample representation. Choices: snapshot | space_time_trajectory.
  reconstruction_unit: space_time_trajectory  # choices: snapshot | space_time_trajectory

  # Field schema; units align positionally with names.
  field_names: [u]
  field_units: [dimensionless]

  # Scaling. Choices: none | mean_std | robust_99.
  normalization: mean_std  # choices: none | mean_std | robust_99

  # Temporal sampling and benchmark eligibility.
  time_stride: 1
  benchmark_eligible: true

  # Coordinate and logical-grid geometry.
  coordinate_dim: 2
  grid_shape: [256]
  grid_mapping_verified: true
