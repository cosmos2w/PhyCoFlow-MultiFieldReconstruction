defaults:
  - ../../../../configs/defaults/base_training.yaml
  - ../dataset.yaml
  - ../sensors/temp_only_random_192_384.yaml
  - ../../../../configs/models/gl_rbf_cq.yaml

stage: base_training
case: coastal_bench

# Preserve the canonical architecture. Random queries change on every update;
# sampled-query training still supervises all four fields at each query point.
model:
  query_points: 1024
  train_query_microbatch_size: 1024
  gather_query_chunk_size: 1024
  neighbor_backend: torch
  reconstruction_query_chunk_size: 2048

optimization:
  epochs: 5000
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0

runtime:
  seed: 42
  device: cuda:0
  deterministic: true
  # 27,744 full-resolution training frames occupy 13.56 GB in float32.
  # This profile targets a 48 GB L40S; async_cpu is the low-memory alternative.
  data_strategy: vram
  num_workers: 0
  progress: true
  plot_every_steps: 50

evaluation:
  split: validation
  sample_selection: uniform
  max_samples: 72
  query_points: null
  generation_steps: 16
  seed: 2027
  preview:
    enabled: true
    loss_every_epochs: 10
    reconstruct_every_epochs: 250
    split: validation
    sample_index: 1728
    # Reconstruct every mesh point so the preview reads as a connected field.
    query_points: null
    generation_steps: 8
    seed: 2027
    keep_history: true

checkpointing:
  enabled: true
  every_epochs: 10
  epochs: [50, 100, 500, 1000, 2000, 2500, 3000, 4000, 5000]
  save_epoch_one: true

benchmark_telemetry:
  # Per-step telemetry retains and repeatedly serializes every update. Keep it
  # for short benchmarks only, not this 4,335,000-update production run.
  enabled: false
  sample_steps: 20

output:
  experiment_name: coastal_temp_gl_rbf_cq_5000ep
