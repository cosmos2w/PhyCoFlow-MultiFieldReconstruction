# Observation template: sampling protocol and per-field sensor budget.

# Sensor sampling. protocol choices: random_uniform | structured_stride | uniform_spacetime_stride.
observations:

  # Sampling mode. Choices: random_uniform | structured_stride | uniform_spacetime_stride.
  protocol: random_uniform  # choices: random_uniform | structured_stride | uniform_spacetime_stride
  seed: 42

  # Per-field fixed count or inclusive count range.
  fields:
    v: {count: 512}
