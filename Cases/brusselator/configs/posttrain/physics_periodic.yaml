defaults:
  - ../dataset.yaml
  - ../sensors/u_only_random.yaml
stage: post_training
case: brusselator
source_run: null
source_checkpoint: last.pt
inherit_base_config: true
source: {kind: native_run, allow_integration_source: true}
model: {name: coordinate_mlp}
observations: {protocol: random_uniform, seed: 42, fields: {u: {count: 128}}}
physics:
  provider: brusselator_periodic
  domain_length: 20.0
  temporal_derivative_source: paired_finite_difference
  weights: {pde_u: 1.0, pde_v: 1.0, positivity: 0.01}
objectives:
  data_retention: {enabled: true, weight: 0.1}
  physics: {enabled: true, weight: 1.0}
rollout: {steps: 1, solver: euler}
observation_consistency: {mode: none, strength: 0.0, final_clamp: false}
trainable: {scope: full_model}
optimization: {epochs: 1, batch_size: 1, lr: 5.0e-5, weight_decay: 0.0, grad_clip: 1.0, gradient_balance: weighted_sum}
runtime: {seed: 42, device: 'cuda:0', deterministic: true, num_workers: 0}
output: {experiment_name: phase8_brusselator_physics_posttrain}
