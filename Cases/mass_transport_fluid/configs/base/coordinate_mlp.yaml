defaults:
  - ../dataset.yaml
  - ../sensors/concentration_only_random.yaml
stage: base_training
case: mass_transport_fluid
dataset: {allow_nonbenchmark: true}
model: {name: coordinate_mlp, hidden_dim: 64, fourier_bands: 8, query_points: 512}
optimization: {epochs: 1, batch_size: 1, lr: 1.0e-4, weight_decay: 0.0, grad_clip: 1.0}
runtime: {seed: 42, device: 'cuda:0', deterministic: true, num_workers: 0}
evaluation:
  generation_steps: 1
  preview: {enabled: true, every_epochs: 1, split: validation, sample_index: 0, query_points: null, generation_steps: 1, seed: 2027, keep_history: false}
checkpointing: {enabled: true, every_epochs: 1, save_epoch_one: true}
output: {experiment_name: phase7_mass_integration_only}
