defaults: [../coherence/all_three_demo50.yaml]

stage: post_training
case: turbulent_combustion
source_run: ../../../0_demo_TurbulentCombustion/Save_TrainedModel/ffm_tc_pointcloud_DemoN50_20260706_084857
source_checkpoint: best.pt
inherit_base_config: true
source:
  kind: legacy_demo50
  allow_integration_source: false
  channel_mapping:
    - {channel: 0, checkpoint_label: CH4, dataset_field: CO}
    - {channel: 1, checkpoint_label: CO, dataset_field: T}
    - {channel: 2, checkpoint_label: T, dataset_field: U_0}
    - {channel: 3, checkpoint_label: U_1, dataset_field: U_1}
    - {channel: 4, checkpoint_label: p, dataset_field: p}

dataset:
  path: ../../Dataset/turbulent_combustion/Merged_COTU0U1P.h5
  split: train
  reconstruction_unit: snapshot
  field_names: [CO, T, U_0, U_1, p]
  field_units: [unknown, unknown, unknown, unknown, unknown]
  normalization: none
  coordinate_dim: 3
  time_stride: 1
  benchmark_eligible: true

model:
  name: legacy_demo50
  query_points: 4096

observations:
  protocol: random_uniform
  seed: 42
  fields:
    U_0: {count: 256}

objectives:
  data_retention: {enabled: true, weight: 0.1}
  coherence: {enabled: true, weight: 1.0}

rollout: {steps: 2, solver: euler}

observation_consistency:
  mode: endpoint_smooth
  strength: 1.0
  sigma: 0.05
  schedule_power: 2.0
  final_clamp: true
  chunk_size: 2048

trainable: {scope: full_model}

optimization:
  epochs: 10000
  batch_size: 4
  train_fraction: 0.25
  lr: 5.0e-5
  weight_decay: 1.0e-6
  grad_clip: 1.0
  gradient_balance: config
  config_missing_behavior: error
  config_data_grad_scale: 1.0
  config_coherence_grad_scale: 1.0

runtime:
  seed: 42
  device: cuda:0
  deterministic: true
  num_workers: 0
  data_strategy: auto
  progress: true
  plot_every_steps: 10

evaluation:
  split: validation
  max_samples: 4
  query_points: 4096
  generation_steps: 2
  seed: 2027
  preview:
    enabled: false
    every_epochs: 1
    split: validation
    sample_index: 0
    query_points: null
    generation_steps: 2
    seed: 2027
    keep_history: false

checkpointing: {enabled: true, every_epochs: 5, save_epoch_one: true}

output:
  experiment_name: demo50_all_coherence_posttrain
