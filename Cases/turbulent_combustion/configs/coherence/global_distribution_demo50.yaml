coherence:
  schedule:
    start_epoch: 1
    every_n_steps: 1
    weight_warmup_epochs: 0
    interval_rescale: false
  compute_budget:
    batch_size: 1
    point_count: 4096
  families:
    global_distribution:
      enabled: true
      target_use: paired_supervised
      units: model_units
      fields: [CO, T, U_0, U_1, p]
      reference_bank:
        enabled: false
        path: null
        max_samples: 16
        points_per_sample: 4096
        seed: 1234
      components:
        self:
          enabled: true
          weight: 1.0
        mutual:
          enabled: true
          weight: 1.0
          directions: 16
          seed: 1234
        cross:
          enabled: true
          weight: 1.0
          directions: 32
          top_fraction: 0.10
          seed: 1234
          include_axes: true
          qmc: true
