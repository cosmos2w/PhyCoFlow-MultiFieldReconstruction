defaults:
  - ../dataset.yaml
  - ../sensors/T_only_random.yaml

stage: base_training
case: turbulent_combustion
model:
  name: pointcloud_ffm
  backbone: gl_rbf_enh
  gather_mode: topk_rbf
  hidden_dim: 64
  latent_dim: 64
  num_latents: 16
  heads: 4
  latent_blocks: 1
  gather_topk: 8
  query_chunk_size: 2048
  query_points: 512
  prior: rff
optimization: {epochs: 1, batch_size: 1, lr: 1.0e-4, weight_decay: 0.0, grad_clip: 1.0}
runtime: {seed: 42, device: 'cuda:0', deterministic: true, num_workers: 0}
evaluation:
  generation_steps: 2
  preview: {enabled: true, every_epochs: 1, split: validation, sample_index: 0, query_points: null, generation_steps: 2, seed: 2027, keep_history: false}
checkpointing: {enabled: true, every_epochs: 1, save_epoch_one: true}
output: {experiment_name: phase7_combustion_pointcloud}
