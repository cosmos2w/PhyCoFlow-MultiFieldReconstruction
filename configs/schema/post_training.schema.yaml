stage: post_training
required:
  - case
  - dataset
  - model
  - observations
  - source_run
  - source_checkpoint
  - optimization
  - runtime
  - output
requires_one_of: [coherence, physics]
forbidden: []

notes:
  - Exactly one of coherence or physics is allowed.
  - Source dataset/model/observation sections may be inherited before validation.
  - Both post-training modes require objectives, rollout, observation_consistency, and trainable.
  - global_distribution.target_use is training_reference or paired_supervised.
  - Observation consistency is a rollout constraint, not a coherence family.
