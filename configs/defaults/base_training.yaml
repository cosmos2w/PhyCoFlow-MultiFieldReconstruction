# Active common source for all modern base-training profiles.

# Composition order; later files override earlier defaults.
defaults:
  - runtime.yaml
  - evaluation.yaml
  - checkpointing.yaml

# Run identity. Choices: base_training | post_training | direct_physics.
stage: base_training  # choices: base_training | post_training | direct_physics

# Training duration, batch sizing, optimizer, and gradient controls.
optimization:
  epochs: 200
  batch_size: 1
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_clip: 1.0
