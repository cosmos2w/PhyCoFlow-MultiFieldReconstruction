# Compose into a case post-training configuration with an explicit physical measure.
# Configure dataset-specific geometry, floors, point counts and fidelity policy.
defaults:
  - ../coherence/scalable_state.yaml
  - ../coherence/scalable_scale.yaml
  - ../coherence/scalable_shape.yaml
coherence:
  scalable_anchored_coherence: {enabled: true}
  compute_budget: {query_policy: fixed_shared}
  schedule: {start_epoch: 1, every_n_steps: 1, weight_warmup_epochs: 0}
runtime:
  plot_every_steps: 10
objectives:
  data_retention: {enabled: false, weight: 0.0}
  coherence: {enabled: true, weight: 1.0}
trainable:
  scope: full_model
optimization:
  multitask:
    family_scalarization: {method: none}
    outer_aggregation: null
    coherence_aggregation: {method: torchjd_config}
    external_policy: {method: lagrangian, vector_reduction: sum}
    fidelity_budget: {metric: physical_member_mse_model_units, relative_increase: 0.10, absolute_allowance: 0.0, denominator_floor: 1.0e-8}
