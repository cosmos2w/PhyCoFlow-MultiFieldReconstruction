# Shared validation-loss and reconstruction-preview defaults.

# Validation and preview policy. split choices: train | validation | test.
evaluation:
  split: validation  # choices: train | validation | test
  max_samples: 1
  query_points: null
  generation_steps: 8
  seed: 2027
  preview:
    enabled: true  # mandatory fixed validation monitor during training
    loss_every_epochs: 10  # cheap validation objective; also updates loss_history.png
    reconstruct_every_epochs: 500  # expensive qualitative reconstruction artifacts
    split: validation  # choices: train | validation | test
    sample_index: 0
    query_points: null
    generation_steps: 8
    seed: 2027
    keep_history: false
