# Paired physical-occupation State. A case provider supplies the frozen native
# measure and each endpoint's aligned query masses/masks through family context.
coherence:
  families:
    global_distribution:
      definition: marginal_mixed_weighted_v3
      enabled: true
      weight: 1.0
      target_use: paired_supervised
      units: model_units
      reference_bank: {enabled: false}
      components:
        self: {enabled: true, weight: 1.0}
        mutual: {enabled: false}
        cross: {enabled: true, weight: 1.0, directions: 32, top_fraction: 1.0, seed: 1234, include_axes: false, qmc: true}
