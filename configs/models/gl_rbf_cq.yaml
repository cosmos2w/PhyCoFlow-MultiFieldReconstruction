# Canonical portable GL-RBF/CQ model settings.  Keep serialized names and
# values stable: existing case checkpoints consume this state contract.

# Model family and architecture settings.
model:

  # Model identity. name choices are the templates in configs/models/.
  name: gl_rbf_cq
  backbone: GL_rbf_ENH_CQ  # required for gl_rbf_cq

  # Flow prior and noise floor.
  sigma_min: 1.0e-4
  prior: rff  # choices: iid | rff
  rff_features: 256
  rff_lengthscale: 0.15

  # Feature widths and field embeddings.
  hidden_dim: 256
  cond_dim: 128
  field_embed_dim: 128
  rbf_sigma: 0.05

  # Coordinate positional encoding.
  USE_FOURIER_PE: true
  fourier_pe_num_bands: 32
  fourier_pe_max_freq: 64.0

  # Latent attention capacity.
  latent_dim: 128
  num_latents: 128
  num_heads: 8
  num_latent_blocks: 4
  ff_mult: 4
  attn_dropout: 0.0
  mlp_dropout: 0.0

  # Condition summarization and attention execution modes.
  summary_type: mean  # choices: cls | mean
  sensor_coord_encoding: fourier  # choices: raw | fourier
  latent_sensor_reinject: true
  latent_reinject_every: 1
  condition_attention_execution: cached_kv  # choices: legacy_mha | cached_kv
  sensor_attention_padding_mode: full  # required for gl_rbf_cq

  # Local query gathering and neighbor search.
  gather_mode: topk_rbf_glres  # required for gl_rbf_cq
  gather_topk: 32
  gather_query_chunk_size: 2048
  learnable_rbf_sigma: true
  neighbor_backend: keops  # choices: torch | keops
  sensor_local_topk: 16
  sensor_local_dropout: 0.0

  # Enhanced global-residual query head.
  query_latent_readout: true
  query_readout_type: coord  # choices: point | coord
  query_readout_scale_init: 1.0e-2
  enhanced_head_norm: true
  glres_scale_init: 1.0e-2

  # CQ readout dimensions, factorization, and fusion.
  cq_query_dim: 128
  cq_readout_mode: lowrank  # choices: full | lowrank
  cq_readout_rank: 64
  cq_readout_heads: 4
  cq_fusion_mode: additive  # choices: additive | structured_concat
  cq_global_scale_init: 1.0
  cq_local_scale_init: 1.0
  cq_readout_scale_init: 1.0e-2

  # CQ time conditioning.
  cq_time_conditioning: sinusoidal_film  # choices: scalar_concat | sinusoidal_film
  cq_time_embed_dim: 128
  cq_time_max_period: 10000.0
  cq_time_film_zero_init: true

  # CQ observation-value support.
  cq_measurement_support_mode: rbf_value_support  # choices: none | rbf_value_support
  cq_measurement_support_normalize: true

  # Exponential moving-average lifecycle.
  model_ema_enabled: true
  model_ema_decay: 0.999
  model_ema_eval: true

  # Training query batching and context reuse.
  query_points: 4096
  train_query_microbatch_size: 2048
  reuse_condition_context_across_query_microbatches: true

  # Reconstruction streaming and cache policy.
  reconstruction_execution_mode: cached_streamed  # choices: legacy_full | cached_streamed
  reconstruction_query_chunk_size: 8192
  reconstruction_cache_level: static_features  # choices: none | geometry | static_features

  # Generation integrator. Choices: euler | heun.
  ode_solver: euler  # choices: euler | heun
